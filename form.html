<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 Product Review</title>
    <meta name="description"
      content="Submit a product review by selecting a product, rating it, and sharing your feedback.">
    <meta name="author" content="John Neal Caballero">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
       <form action="review.html" method="get">
        <label for="productName">Product Name</label>
        <select name="productName" id="productName" required>
            <option value="" disabled selected>Select a Product ...</option>
        </select>

        <fieldset>
            <legend>Overall Rating</legend>
            <input type="radio" id="rating1" name="rating" value="1" required>
            <label for="rating1">☆</label>
            <input type="radio" id="rating2" name="rating" value="2" required>
            <label for="rating2">☆☆</label>
            <input type="radio" id="rating3" name="rating" value="3" required>
            <label for="rating3">☆☆☆</label>
            <input type="radio" id="rating4" name="rating" value="4" required>
            <label for="rating4">☆☆☆☆</label>
            <input type="radio" id="rating5" name="rating" value="5" required>
            <label for="rating5">☆☆☆☆☆</label>
        </fieldset>
        
        <label for="installationDate">Date of Installation</label>
        <input type="date" id="installationDate" name="installationDate" required>

        <fieldset>
            <legend>Useful Features</legend>

            <input type="checkbox" id="durability" name="features" value="durability">
            <label for="durability">Durability</label>

            <input type="checkbox" id="easeofuse" name="features" value="easeofuse">
            <label for="easeofuse">Ease of Use</label>

            <input type="checkbox" id="performance" name="features" value="performance">
            <label for="performance">Performance</label>

            <input type="checkbox" id="design" name="features" value="design">
            <label for="design">Design</label>
        </fieldset>

        <label for="writtenReview">Written Review (Optional)</label>
        <textarea name="writtenReview" id="writtenReview"></textarea>

        <label for="userName">Your Name (Optional)</label>
        <input type="text" id="userName" name="userName">

        <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>© <span id="currentyear"></span> ⚔️John Neal Caballero | ⚔️ Laguna Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
